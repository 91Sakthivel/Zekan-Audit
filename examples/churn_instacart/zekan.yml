contract:
  prediction_problem: churn
  entity_id: customer_id
  prediction_time: snapshot_date
  target: churned
  available_features_until: snapshot_date
  forbidden_after_prediction:
    - leaky_col
  severity_thresholds:
    metric: roc_auc
    low_max: 0.02
    moderate_max: 0.05
    high_max: 0.10
  cost_model:
    decision: send_retention_offer
    discount_cost: [10.0, 25.0]
    customer_value: [100.0, 500.0]
    conversion_lift: [0.05, 0.20]
  schema_version: "1"
  zekan_version: "0.1.0"

model:
  type: sklearn.ensemble.GradientBoostingClassifier
  params:
    n_estimators: 100
    max_depth: 3
